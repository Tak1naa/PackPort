[build-system]
requires = ["meson-python>=0.16"]
build-backend = "mesonpy"

[project]
name = "packport"
version = "0.1.0"
description = "A safe drag-and-drop package installer for Fedora"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PackPort contributors" }]

[project.urls]
Homepage = "https://github.com/Tak1naa/PackPort"

